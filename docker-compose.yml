services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutricare
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: nutricare
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
